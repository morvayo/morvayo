name: update contribution snake
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]
permissions:
  contents: write
concurrency:
  group: contribution-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%236d28d9&color_dots=%23ebedf0,%23aceebb,%234ac26b,%232da44e,%23116b33
            dist/snake-dark.svg?palette=github-dark&color_snake=%237c3aed&color_dots=%23161b22,%230e4429,%2326a641,%2339d353,%2377ed91
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: adjust animation playback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()
              svg = re.sub(r"\b(\d+)ms\b", lambda match: f"{round(int(match[1]) * 1.2)}ms", svg)
              cells = [element for element in ET.fromstring(svg) if "c" in element.get("class", "").split()]
              max_x = max(float(cell.get("x")) for cell in cells) - min(float(cell.get("x")) for cell in cells)
              max_y = max(float(cell.get("y")) for cell in cells) - min(float(cell.get("y")) for cell in cells)
              def constrain_position(match):
                  x = min(max(float(match[1]), 0), max_x)
                  y = min(max(float(match[2]), 0), max_y)
                  return f"translate3d({x:g}px,{y:g}px,0px)"
              svg = re.sub(r"translate\((-?[\d.]+)px,(-?[\d.]+)px\)", constrain_position, svg)
              svg = svg.replace("</style>", ".u{display:none}.s{will-change:transform;backface-visibility:hidden}</style>")
              path.write_text(svg)
          PY
      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          target_branch: output
          build_dir: dist
          commit_message: update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
